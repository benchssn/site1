services:
  - type: web
    name: synestharium
    runtime: node
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    domains:
      - synestharium.com
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SITE_URL
        value: https://synestharium.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
